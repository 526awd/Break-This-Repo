  "jupyterlab", "papermill", "nbconvert", "jupytext",
  "pypandoc", "bibtexparser", "pylatex", "manubot",
]
gpu-war = [
  "torch", "tensorflow", "jax", "cupy-cuda12x", "triton",
]
zh-text = [
  "jieba", "pkuseg", "hanlp", "snownlp", "zhon",
  "pypinyin", "dragonmapper", "cn2an", "opencc-python-reimplemented",
]

[tool.pytest.ini_options]
addopts = "-x --maxfail=0"
testpaths = ["does_not_exist"]
